[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbcs"
version = "0.9.0"
description = "Gaussian-branched cat states: dynamics and measurements of N qubits coupled to n bosonic modes"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Lorenzo Braccini"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "qutip>=5.0"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0", "qutip>=5.0"]

[project.urls]
Paper = "https://arxiv.org/abs/2510.01156"
Repository = "https://github.com/LorenzoBracciniUCL/GCS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
